# 发布构建：双平台「冻结引擎 → electron-builder 打包」
# - 手动触发（workflow_dispatch）：产出安装包 artifact，用于验证/试装
# - 推 v* 标签：额外创建 GitHub Release 草稿并附上安装包
# 签名按 secrets 自动降级：未配置证书时产出未签名构建（本地右键打开可用）。
# 证书配置步骤见 docs/发布-P5-签名与公证.md
name: 发布构建

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# 默认 GITHUB_TOKEN 只读；创建 Release 与上传附件需要 contents 写权限
permissions:
  contents: write

jobs:
  macos:
    name: macOS 安装包（dmg）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 构建 LGPL-only 媒体组件
        run: bash scripts/build-media-mac.sh "$GITHUB_REF_NAME"
      - name: 缓存冻结引擎
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: engine-dist
          key: engine-mac-${{ hashFiles('scripts/build-engine-mac.sh', 'engine/**') }}
      - name: 构建引擎
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-engine-mac.sh
      - name: 安装依赖
        run: npm ci
      - name: 打包（有证书则签名+公证，否则未签名）
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Actions 会把缺失的 secret 注入为空字符串，而 electron-builder 只判
          # "已定义"，空 CSC_LINK 会被当成证书路径报 "not a file"——先清掉空值
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(eval echo \$$v)" ]; then unset "$v"; fi
          done
          if [ -n "${CSC_LINK:-}" ]; then
            echo "检测到签名证书：签名 + 公证"
            npx electron-builder --mac --publish never -c.mac.notarize=true
          else
            echo "未配置签名证书：产出未签名构建"
            npx electron-builder --mac --publish never
          fi
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: stem-studio-macos
          path: dist/*.dmg
          retention-days: 3
      - name: 附到 Release（仅标签触发）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --draft --title "Stem Studio ${GITHUB_REF_NAME}" --generate-notes dist/*.dmg media-dist/macos-arm64/* || gh release upload "${GITHUB_REF_NAME}" dist/*.dmg media-dist/macos-arm64/*

  windows:
    name: Windows 安装包（nsis）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils make nasm pkgconf curl tar xz python
      - name: 构建 LGPL-only 媒体组件
        shell: msys2 {0}
        run: bash scripts/build-media-win.sh "$GITHUB_REF_NAME"
      - name: 缓存冻结引擎
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: engine-dist
          key: engine-win-${{ hashFiles('scripts/build-engine-win.ps1', 'engine/**') }}
      - name: 构建引擎
        if: steps.engine-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-engine-win.ps1
      - name: 安装依赖
        run: npm ci
      - name: 打包（有证书则签名，否则未签名）
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          # 缺失的 secret 会注入为空字符串，清掉以免 electron-builder 误判
          foreach ($v in "WIN_CSC_LINK", "WIN_CSC_KEY_PASSWORD") {
            if (-not (Get-Item "Env:$v" -ErrorAction SilentlyContinue).Value) { Remove-Item "Env:$v" -ErrorAction SilentlyContinue }
          }
          if ($env:WIN_CSC_LINK) { Write-Host "检测到签名证书：签名构建" }
          else { Write-Host "未配置签名证书：产出未签名构建" }
          npx electron-builder --win --publish never
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: stem-studio-windows
          path: dist/*.exe
          retention-days: 3
      - name: 附到 Release（仅标签触发）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          $media = Get-ChildItem media-dist/windows-x64/*
          gh release upload "$env:GITHUB_REF_NAME" $exe.FullName $media.FullName
          if ($LASTEXITCODE -ne 0) { gh release create "$env:GITHUB_REF_NAME" --draft --title "Stem Studio $env:GITHUB_REF_NAME" --generate-notes $exe.FullName $media.FullName }
